<title>Juego del Impostor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.12);
    border-radius: 22px;
    padding: 50px;
    margin-top: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

input, button {
    width: 100%;
    padding: 14px;
    border-radius: 18px;
    border: none;
    margin-top: 12px;
    font-size: 16px;
}

input[type="checkbox"] {
    width: auto;
    transform: scale(1.2);
}

button {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

button.secondary {
    background: linear-gradient(135deg, #1e90ff, #3742fa);
}

.rol {
    font-size: 24px;
    margin: 20px 0;
    white-space: pre-line;
}

label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
}

.oculto { display: none; }
</style>
</head>

<body>

<div class="container">

<h1>🕵️ Juego del Impostor</h1>

<!-- CONFIGURACIÓN -->
<div id="configuracion" class="card">
    <input type="number" id="jugadores" min="3" max="20" placeholder="👥 Jugadores">
    <input type="number" id="impostores" value="1" min="1" max="5" placeholder="🕵️ Impostores">

    <label>🎯 Pista para el impostor <input type="checkbox" id="pistaImpostor" checked></label>
    <label>🕵️‍♂️ Activar detective <input type="checkbox" id="rolDetective"></label>
    <label>💣 Activar saboteador <input type="checkbox" id="rolSaboteador"></label>

    <button onclick="crearJugadores()">Empezar 🚀</button>
</div>

<!-- NOMBRES -->
<div id="nombres" class="card oculto">
    <h3>✏️ Nombres</h3>
    <div id="inputsNombres"></div>
    <button onclick="iniciarJuego()">Continuar 🎲</button>
</div>

<!-- JUEGO -->
<div id="juego" class="card oculto">
    <h2 id="turno"></h2>
    <div id="rol" class="rol">Pulsa para ver tu rol</div>
    <button onclick="verRol()">👁 Ver rol</button>
    <button onclick="siguiente()">➡️ Siguiente</button>
</div>

<!-- FINAL -->
<div id="final" class="card oculto">
    <h3>🗣️ Empieza el debate</h3>
    <p id="empieza"></p>
    <p>Sentido horario ⏰</p>
    <button onclick="revelar()">🔍 Revelar resultado</button>
    <button class="secondary" onclick="nuevaPartida()">🔄 Nueva partida</button>
    <div id="resultado" class="rol oculto"></div>
</div>

</div>

let jugadores=[], roles=[], impostoresReales=[];
let jugadorActual=0, categoria="", palabra="";
let detective="", saboteador="";

function crearJugadores() {
    const num=document.getElementById("jugadores").value||4;
    const cont=document.getElementById("inputsNombres");
    cont.innerHTML="";
    const guardados=JSON.parse(localStorage.getItem("jugadores"))||[];
    for(let i=0;i<num;i++){
        const input=document.createElement("input");
        input.value=guardados[i]||"";
        input.placeholder="Jugador "+(i+1);
        cont.appendChild(input);
    }
    document.getElementById("configuracion").classList.add("oculto");
    document.getElementById("nombres").classList.remove("oculto");
}

function iniciarJuego() {
    jugadores=[...document.querySelectorAll("#inputsNombres input")]
        .map((i,idx)=>i.value||"Jugador "+(idx+1));
    localStorage.setItem("jugadores",JSON.stringify(jugadores));

    const keys=Object.keys(categorias);
    categoria=keys[Math.floor(Math.random()*keys.length)];
    palabra=categorias[categoria][Math.floor(Math.random()*categorias[categoria].length)];

    roles=Array(jugadores.length).fill(`✅ CIVIL\nPalabra: ${palabra}`);
    impostoresReales=[];
    detective="";
    saboteador="";

    let indices=[...Array(jugadores.length).keys()].sort(()=>Math.random()-0.5);

    const numImpostores=document.getElementById("impostores").value;
    const pista=document.getElementById("pistaImpostor").checked;

    for(let i=0;i<numImpostores;i++){
        roles[indices[i]]=pista
            ? `❌ IMPOSTOR\nCategoría: ${categoria}`
            : "❌ IMPOSTOR";
        impostoresReales.push(jugadores[indices[i]]);
    }

    let pos=numImpostores;

    if(document.getElementById("rolDetective").checked){
        roles[indices[pos]]=`🕵️‍♂️ DETECTIVE\nPalabra: ${palabra}`;
        detective=jugadores[indices[pos]];
        pos++;
    }

    if(document.getElementById("rolSaboteador").checked){
        roles[indices[pos]]=
            `💣 SABOTEADOR\nPalabra: ${palabra}\nObjetivo: que te voten como impostor`;
        saboteador=jugadores[indices[pos]];
    }

    jugadorActual=0;
    document.getElementById("nombres").classList.add("oculto");
    document.getElementById("juego").classList.remove("oculto");
    actualizarTurno();
}

function actualizarTurno(){
    document.getElementById("turno").textContent=jugadores[jugadorActual];
    document.getElementById("rol").textContent="Pulsa para ver tu rol";
}

function verRol(){
    document.getElementById("rol").textContent=roles[jugadorActual];
}

function siguiente(){
    jugadorActual++;
    if(jugadorActual>=jugadores.length){
        document.getElementById("juego").classList.add("oculto");
        document.getElementById("final").classList.remove("oculto");
        document.getElementById("empieza").textContent=
            "Empieza hablando: "+jugadores[Math.floor(Math.random()*jugadores.length)];
    } else actualizarTurno();
}

function revelar(){
    const r=document.getElementById("resultado");
    r.classList.remove("oculto");
    r.textContent=
`🕵️ Impostor(es): ${impostoresReales.join(", ")}
🕵️‍♂️ Detective: ${detective||"Ninguno"}
💣 Saboteador: ${saboteador||"Ninguno"}
📚 Categoría: ${categoria}
🧠 Palabra: ${palabra}`;
}

function nuevaPartida(){
    document.getElementById("final").classList.add("oculto");
    document.getElementById("resultado").classList.add("oculto");
    document.getElementById("configuracion").classList.remove("oculto");
}
</script>
